name: Spec watch

# Fails when the MCP specification changes in a way the client may need to
# follow. See "Watching the specification" in DEVELOPMENT.md.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: Compare with the pinned specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare
        run: scripts/spec_watch.sh
