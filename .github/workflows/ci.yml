name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    name: Specs (${{ matrix.os }}, Crystal ${{ matrix.crystal }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        crystal: ["1.20", "1.21", latest]
    steps:
      - uses: actions/checkout@v5
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Run specs
        run: crystal spec --order random

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: crystal-lang/install-crystal@v1
      - name: Install dependencies
        run: shards install
      - name: Build the apps
        run: shards build
      - name: Check formatting
        run: crystal tool format --check src spec samples apps
      - name: Build the linter
        run: mkdir -p bin && cp lib/ameba/bin/ameba.cr bin && crystal build -o bin/ameba bin/ameba.cr
      - name: Lint
        run: bin/ameba src spec samples apps

  integration:
    name: Reference server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: crystal-lang/install-crystal@v1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run specs against server-everything
        run: crystal spec --tag integration
        env:
          MCPC_INTEGRATION: "1"
